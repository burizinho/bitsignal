name: Registro semanal do veredito

# Grava o veredito da última semana fechada de cada modelo: v1 em data/verdicts/weekly_verdicts.csv
# (config/config_v1.yaml), v2 em data/verdicts/weekly_verdicts_v2.csv (config/config.yaml) e o braço de
# comparação minimal em data/verdicts/weekly_verdicts_minimal.csv (config/config_minimal.yaml).
# Segunda e terça às 12:00 UTC: o CoinMetrics publica o dado de domingo no dia seguinte, e a
# segunda execução só grava se a primeira não encontrou a semana nova (linhas nunca são reescritas).
on:
  schedule:
    - cron: "0 12 * * 1,2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-verdict
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Record verdict (v1)
        run: bitsignal record-verdict --config config/config_v1.yaml
      - name: Record verdict (v2)
        run: bitsignal record-verdict
      - name: Record verdict (minimal, comparison arm)
        run: bitsignal record-verdict --config config/config_minimal.yaml
      - name: Send Telegram notification (optional)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not token or not chat_id:
              print('Telegram secrets not set, skipping notification.')
              exit(0)
          import pandas as pd
          try:
              df = pd.read_csv('data/verdicts/weekly_verdicts_v2.csv')
              last = df.iloc[-1]
              msg = (
                  f'⚡ *BitSignal — Veredito Semanal*\n\n'
                  f'📅 *Semana:* {last[\"week\"]}\n'
                  f'🎯 *Fase:* {last[\"phase\"]}\n'
                  f'📉 *Meta de Venda Acumulada:* {float(last[\"sell_target\"])*100:.0f}%\n'
                  f'💡 *Motivo:* {last[\"reason\"]}\n\n'
                  f'Painel: https://bitsignal.streamlit.app'
              )
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage', data={'chat_id': chat_id, 'text': msg, 'parse_mode': 'Markdown'}, timeout=10)
              print('Telegram notification sent successfully.')
          except Exception as exc:
              print(f'Telegram notice error: {exc}')
          "
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- data/verdicts)" ]; then
            echo "Nada novo para gravar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/verdicts
          git commit -m "chore(verdicts): registro semanal do veredito"
          git pull --rebase origin main
          git push origin HEAD:main
